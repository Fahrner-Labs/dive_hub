# Publishes the Android app: the android-vX.Y.Z or android-vX.Y.Z-rcN tag is the only input (ADR 0077 D7). The tag
# must point at a commit on main; the release APK is signed with the release key from GitHub Actions secrets,
# checked with apksigner and attached to the GitHub Release. An rc publishes a non-latest prerelease; a stable tag
# publishes a latest release. A tag that fails the checks publishes nothing.
name: android release

on:
  push:
    tags: ['android-v*']
  # Re-runs and repairs: give the existing release tag, e.g. android-v0.1.0. The job checks out that tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Android release tag to publish (android-vX.Y.Z or android-vX.Y.Z-rcN)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # One run per tag; never cancel half way through an upload.
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: verify tag on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      versionName: ${{ steps.release.outputs.versionName }}
      versionCode: ${{ steps.release.outputs.versionCode }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the ancestor check needs it.
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Check the tag and its commit
        id: release
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          release="$(node scripts/android-version-code.mjs "$tag")"
          printf '%s\n' "$release" >> "$GITHUB_OUTPUT"
          prerelease="$(printf '%s\n' "$release" | sed -n 's/^prerelease=//p')"
          version_name="$(printf '%s\n' "$release" | sed -n 's/^versionName=//p')"
          base_version="${version_name%-rc*}"
          git rev-parse --verify "refs/tags/$tag" >/dev/null || {
            echo "::error::tag $tag does not exist"
            exit 1
          }
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::commit $sha of $tag is not an ancestor of origin/main; tags are cut only on main (ADR 0077 D4)"
            exit 1
          fi
          if [ "$prerelease" = "true" ] && git rev-parse --verify "refs/tags/android-v$base_version" >/dev/null 2>&1; then
            echo "::error::'$tag' was cut after the final release 'android-v$base_version'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag from $sha"

  build:
    name: build signed APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      # Same toolchain as the check lane (ADR 0073).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image already carries an Android SDK with `ANDROID_HOME`; install the platform AGP 9.5 and
      # Compose 1.12 need. (android-actions/setup-android@v3 fails on the runner's SDK because it asks for the
      # removed `tools` package, so the existing SDK is used directly.)
      - name: Android SDK platform and build tools
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          yes | "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      # The keystore exists only for this run, under $RUNNER_TEMP, and is never committed or printed.
      - name: Decode the release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 is not set; see apps/android/README.md and ADR 0077 D2"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          (umask 077 && printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore")
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: apps/android
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ needs.verify.outputs.versionName }}
          ANDROID_VERSION_CODE: ${{ needs.verify.outputs.versionCode }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # The build must not fall back to the debug key (ADR 0077 D6): apksigner checks a real v2+ signature.
      - name: Verify the APK signature
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::$apk was not built"; exit 1; }
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          fi
          "$apksigner" verify --verbose --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      # Idempotent: an existing release is edited and its APK replaced, so a repair re-run is safe.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --prerelease --latest=false
            else
              gh release create "$tag" --verify-tag --generate-notes --title "$tag" --prerelease --latest=false
            fi
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --latest --prerelease=false
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag" --latest
          fi
          gh release upload "$tag" dist/app-release.apk --clobber
