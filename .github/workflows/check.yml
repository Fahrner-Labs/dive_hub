# The full check on every push and pull request (ADR 0023, amendment of 2026-10-22): the gate that nothing
# merges past. Same command as on a laptop: pnpm check:full.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Same image as compose.dev.yaml; the tests create a database per file and per e2e server.
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: divehub
          POSTGRES_PASSWORD: divehub-dev
          POSTGRES_DB: divehub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U divehub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The tests create and drop databases on this server only; DATABASE_URL (the application's own database) is
      # deliberately not set here (FAH-39).
      DIVEHUB_TEST_DATABASE_URL: postgres://divehub:divehub-dev@127.0.0.1:5432/divehub
      # An unreachable database fails the server tests here instead of skipping them (test/support.ts).
      REQUIRE_DATABASE: '1'
      # Playwright's own Chromium (cached below); on a laptop the tests use the installed Edge.
      PLAYWRIGHT_CHANNEL: chromium
      # One retry, in CI only: a test that passes on it is flaky, and the job summary names it (ADR 0023).
      E2E_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint baselines may only shrink: they are compared with the base of the pull request, or with the
          # commit before the push (BASELINE_REF), so the history must be there.
          fetch-depth: 0
      - name: Baseline to compare with
        run: echo "BASELINE_REF=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'workflow_dispatch' && 'origin/main' || github.event.before }}" >> "$GITHUB_ENV"

      # pg_dump/pg_restore for the backup tests (ADR 0069); the major version tracks the postgres service image.
      - name: PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The Android lane (ADR 0073): the shared JVM tests and the debug APK. `cache: gradle` keeps the wrapper and
      # dependencies between runs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image already carries an Android SDK with `ANDROID_HOME`; install the platform AGP 9.5 and
      # Compose 1.12 need. (android-actions/setup-android@v3 fails on the runner's SDK because it asks for the
      # removed `tools` package, so the existing SDK is used directly.)
      - name: Android SDK platform and build tools
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          yes | "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @dive-hub/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @dive-hub/web exec playwright install --with-deps chromium
      - name: Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @dive-hub/web exec playwright install-deps chromium

      - run: pnpm check:full

      # Which browser tests passed only on a retry (ADR 0023, amendment 2026-11-12), on a green run too.
      - name: Flaky browser tests
        if: always()
        run: node scripts/check-log.mjs --flaky >> "$GITHUB_STEP_SUMMARY"

      # Names what failed in the job summary, for the log of check escapes (docs/agents/check-escapes.md). From
      # Playwright's report, not its output folders: with a retry, a flaky test leaves the folder of its failed attempt.
      - name: Failed browser tests
        if: failure()
        run: node scripts/check-log.mjs --failed >> "$GITHUB_STEP_SUMMARY"

      - name: Browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
